# Make 'prod' the active profile by default when running
spring.profiles.active=prod

# ----------------------------------------
# Default Local Database (MySQL)
# ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/manageme
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------
# Global App Configuration
# ----------------------------------------
server.servlet.context-path=/api/v1.0

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSKEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${EMAIL_USERNAME}

# JWT & URLs
jwt.secret.key=${SECRET_KEY}
manageme.frontend.url=${MANAGE_ME_FRONTEND_URL}
app.activation.url=${MANAGE_ME_BACKEND_URL}